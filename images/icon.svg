<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background notebook panel (darker blue, offset) -->
  <rect x="16" y="28" width="176" height="196" rx="12" ry="12" fill="#1B6AC2"/>

  <!-- Foreground notebook panel (lighter blue) -->
  <rect x="48" y="12" width="176" height="196" rx="12" ry="12" fill="#3BA0E6"/>

  <!-- Notebook cell lines (simulating cells) -->
  <!-- Cell 1: play button + line -->
  <polygon points="68,52 68,76 86,64" fill="rgba(255,255,255,0.9)"/>
  <rect x="96" y="56" width="108" height="6" rx="3" fill="rgba(255,255,255,0.6)"/>
  <rect x="96" y="68" width="72" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>

  <!-- Separator line -->
  <line x1="64" y1="90" x2="208" y2="90" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Cell 2: result table motif -->
  <polygon points="68,104 68,128 86,116" fill="rgba(255,255,255,0.9)"/>
  <rect x="96" y="108" width="108" height="6" rx="3" fill="rgba(255,255,255,0.6)"/>
  <rect x="96" y="120" width="90" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>

  <!-- Separator line -->
  <line x1="64" y1="142" x2="208" y2="142" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Cell 3: another cell -->
  <polygon points="68,156 68,180 86,168" fill="rgba(255,255,255,0.9)"/>
  <rect x="96" y="160" width="80" height="6" rx="3" fill="rgba(255,255,255,0.6)"/>
  <rect x="96" y="172" width="108" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>

  <!-- SQL badge circle (bottom right) -->
  <circle cx="204" cy="212" r="40" fill="#0078D4"/>
  <circle cx="204" cy="212" r="37" fill="#1B91E0"/>
  <text x="204" y="213" font-family="Segoe UI Semibold, Segoe UI, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="32" letter-spacing="-0.5" fill="white" text-anchor="middle" dominant-baseline="central">SQL</text>
</svg>
